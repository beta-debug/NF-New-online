<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="สินค้าทั้งหมด - MyShop แพลตฟอร์มขายสินค้าออนไลน์">
    <title>สินค้าทั้งหมด — MyShop</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    
    <style>
        :root {
            --luxe-red: #cc0000;
            --dark-bg: #0f0f0f;
            --input-bg: #1a1a1a;
        }

        /* ปรับแต่งส่วนหัวข้อ */
        .section-title-luxe {
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .section-subtitle-luxe {
            color: #888;
            font-size: 0.9rem;
        }

        /* Container ของ Filter */
        .filter-controls-premium {
            background: var(--dark-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #222;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            margin: 30px auto;
            max-width: 900px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* ช่องค้นหา (Search Box) */
        .search-box-luxe {
            flex: 2;
            background: var(--input-bg);
            border: 1.5px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .search-box-luxe:focus-within {
            border-color: var(--luxe-red);
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.25);
            transform: translateY(-2px);
        }

        .search-icon-luxe {
            font-size: 1.1rem;
            margin-right: 12px;
            filter: grayscale(1) brightness(1.5);
        }

        #product-search {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 0;
            width: 100%;
            outline: none;
            font-size: 1rem;
        }

        #product-search::placeholder {
            color: #555;
            font-weight: 300;
        }

        /* ช่องเลือกหมวดหมู่ (Category Filter) */
        .category-filter-luxe {
            flex: 1;
            position: relative;
        }

        #category-select {
            width: 100%;
            background: var(--input-bg);
            color: #fff;
            border: 1.5px solid #333;
            border-radius: 12px;
            padding: 15px 25px;
            font-size: 0.95rem;
            cursor: pointer;
            appearance: none;
            transition: all 0.3s ease;
        }

        #category-select:hover {
            border-color: var(--luxe-red);
            background: #222;
        }

        /* ลูกศรแต่งใหม่ */
        .category-filter-luxe::after {
            content: '↓';
            font-size: 0.7rem;
            color: var(--luxe-red);
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* ปรับแต่ง Option ภายใน Select */
        #category-select option {
            background: #1a1a1a;
            color: #fff;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content">
        <section class="section-luxe">
            <div class="container luxe-centered">
                <div class="text-center fade-in">
                    <h1 class="section-title-luxe">สินค้าทั้งหมด</h1>
                    <p class="section-subtitle-luxe">เลือกสินค้าที่ใช่สำหรับคุณ สั่งซื้อง่าย จ่ายสะดวก</p>
                </div>

                <div class="filter-controls-premium fade-in">
                    <div class="search-box-luxe">
                        <span class="search-icon-luxe">🔍</span>
                        <input type="text" id="product-search" placeholder="ค้นหาสินค้าที่ต้องการ..."
                            oninput="filterProducts()">
                    </div>
                    <div class="category-filter-luxe">
                        <select id="category-select" onchange="filterProducts()">
                            <option value="all">ทุกหมวดหมู่</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-3 fade-in" id="products-grid">
                    <div class="loader" style="grid-column: 1 / -1;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
</body>

</html>
