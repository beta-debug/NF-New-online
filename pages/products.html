<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="สินค้าทั้งหมด - MyShop แพลตฟอร์มขายสินค้าออนไลน์">
    <title>สินค้าทั้งหมด — MyShop</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <style>
    /* 1. ปรับแต่งแถบควบคุมให้ดูพรีเมียม (Glassmorphism) */
    .filter-controls-premium {
        background: #0a0a0a; /* ดำสนิท */
        padding: 20px;
        border-radius: 15px;
        border-bottom: 3px solid #b30000; /* เส้นใต้สีแดงเข้ม */
        display: flex;
        gap: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 2. ช่องค้นหา (Search Box) */
    .search-box-luxe {
        flex: 2;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 8px;
        display: flex;
        align-items: center;
        padding: 5px 15px;
        transition: 0.3s;
    }

    .search-box-luxe:focus-within {
        border-color: #ff0000; /* ขอบแดงเมื่อกดพิมพ์ */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
    }

    #product-search {
        background: transparent;
        border: none;
        color: #ffffff;
        padding: 10px;
        width: 100%;
        outline: none;
    }

    /* 3. ช่องเลือกหมวดหมู่ (Category Filter) */
    .category-filter-luxe select {
        background: #1a1a1a;
        color: #ffffff;
        border: 1px solid #333;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
        appearance: none; /* ลบลูกศรเดิม */
        min-width: 150px;
    }

    .category-filter-luxe select:hover {
        border-color: #ff0000;
        color: #ff0000;
    }

    /* 4. ตกแต่งหัวข้อสินค้าให้เข้าธีม */
    .section-title-luxe {
        color: #ffffff;
        text-shadow: 2px 2px 0px #b30000; /* เงาตัวอักษรสีแดง */
        font-weight: bold;
        letter-spacing: 2px;
    }
</style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-content">
        <section class="section">
            <div class="container">
                <div class="text-center fade-in">
                    <h1 class="section-title">สินค้าทั้งหมด</h1>
                    <p class="section-subtitle">เลือกสินค้าที่ใช่สำหรับคุณ สั่งซื้อง่าย จ่ายสะดวก</p>
                </div>

                <!-- Filters & Search -->
                <div class="filter-controls-premium fade-in">
                    <div class="search-box-luxe">
                        <span class="search-icon-luxe">🔍</span>
                        <input type="text" id="product-search" placeholder="ค้นหาสินค้าที่ต้องการ..."
                            oninput="filterProducts()">
                    </div>
                    <div class="category-filter-luxe">
                        <select id="category-select" onchange="filterProducts()">
                            <option value="all">ทุกหมวดหมู่</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-3 fade-in" id="products-grid">
                    <div class="loader" style="grid-column: 1 / -1;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/products.js"></script>
</body>


</html>
